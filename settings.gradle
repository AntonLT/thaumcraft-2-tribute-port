pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Matches the folder name, which IDEA expects (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'Thaumcraft 2 Tribute Port'
includeBuild('build-logic')
include('common')
include('fabric')
include('neoforge')

// Alt's patches: a separate mod that depends on this one. Its datapack folder also works without Java.
include('alts-patches-fabric')
include('alts-patches-neoforge')
project(':alts-patches-fabric').projectDir = file('examples/alts-tc2tp-patches/fabric')
project(':alts-patches-neoforge').projectDir = file('examples/alts-tc2tp-patches/neoforge')

