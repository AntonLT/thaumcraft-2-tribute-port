plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom'
}
apply from: '../addon.gradle'

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    implementation(project(':fabric'))
}

loom {
    // The core mod's access widener is for its own code; this addon only uses public API.
    enableTransitiveAccessWideners = false
    runs {
        client { client(); setConfigName('Alts Patches Fabric Client'); runDir('runs/client') }
        server { server(); setConfigName('Alts Patches Fabric Server'); runDir('runs/server') }
    }
}
if (project.hasProperty('smokeTest')) {
    loom.runs.server.vmArg('-Dalts.smokeTest=true')
    loom.runs.server.programArg('nogui')
    tasks.withType(JavaExec).configureEach { standardInput = System.in }
}
