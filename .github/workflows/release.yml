name: Release

# Push a tag named after the version in gradle.properties, for example v1.0.0-rc.2.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag matches the mod version
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: ./gradlew build --console=plain
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls fabric/build/libs/*.jar neoforge/build/libs/*.jar examples/alts-tc2tp-patches/*/build/libs/*.jar | grep -vE -- '-(sources|javadoc)\.jar$')
          prerelease=$(case "$VERSION" in *-*) echo --prerelease;; esac)
          gh release create "$GITHUB_REF_NAME" $files --title "Thaumcraft 2 Tribute Port $VERSION" --generate-notes $prerelease
